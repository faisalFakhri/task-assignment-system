name: Activate scheduled maintenance page

on:
  schedule:
    - cron: '0 0 8 10 *'
      timezone: 'Asia/Jakarta'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  activate-maintenance:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the app and maintenance page
        uses: actions/checkout@v4

      - name: Check out the published GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published-site

      - name: Replace the published entry points at cutover
        env:
          CUTOVER_AT: '2026-10-07T17:00:00Z'
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "Manual run: preserving the current published site."
            exit 0
          fi

          now=$(date -u +%s)
          cutover=$(date -u -d "$CUTOVER_AT" +%s)
          if [ "$now" -lt "$cutover" ]; then
            echo "Cutover time has not arrived; leaving the site unchanged."
            exit 0
          fi

          if grep -q 'name="scheduled-maintenance"' published-site/index.html; then
            echo "The maintenance page is already published."
            exit 0
          fi

          cp public/maintenance.html published-site/index.html
          cp public/maintenance.html published-site/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload current or maintenance site
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
